<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CONTECS 2026 · Ponencia presentada por</title>
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<style>
/*  Tarjeta "Ponencia presentada por" — fuente independiente en OBS.
    Se controla desde configurar.html (cada cuántos minutos, cuántos segundos, mostrar/ocultar ahora).
    Parámetros opcionales en la URL:
      &b=30        distancia al borde inferior en px (en cámara completa se usa b=84 para no tapar la barra)
      &id=3        forzar un expositor (si no, usa la "ponencia en curso")
      &nombre=..&tema=..&cargo=..&k=..   texto escrito directo (ignora datos.js)
      &previa=1    siempre visible (vista previa del configurador)                                   */
  :root{--cond:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif}
  .pp{position:absolute;left:0;width:auto;min-width:660px;max-width:980px;height:165px;visibility:hidden}
  .pp .franja{position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(#fff 0 60%,#000 60%);transform-origin:left;transform:scaleX(0)}
  .pp .fila{position:relative;margin-top:16px;height:149px;display:flex}
  .pp .cuadro{width:72px;background:var(--verde-400);filter:brightness(.8);transform:translateX(-110%)}
  .pp .cuerpo{position:relative;flex:1;background:#032b13;clip-path:polygon(40px 0,100% 0,100% 100%,40px 100%,0 50%);margin-left:-6px;
    padding:10px 56px 10px 82px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.45)}
  .pp .cuerpo::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.12) 50%,transparent 65%);transform:translateX(-120%)}
  .pp .k{font-size:19px;font-weight:800;letter-spacing:.28em;color:var(--verde-400)}
  .pp .t{font-family:var(--cond);font-size:66px;line-height:.95;letter-spacing:.01em;white-space:nowrap;margin-top:6px}
  .pp .s{font-size:23px;font-weight:600;color:var(--gris);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:820px}
  .pp .s b{color:var(--lima);font-weight:700}
  .pp .txt{opacity:0;transform:translateY(30px)}

  /* Entrada */
  .pp.in{visibility:visible}
  .pp.in .franja{animation:franjaIn .7s cubic-bezier(.16,1,.3,1) forwards}
  .pp.in .cuadro{animation:cuadroIn .6s .1s cubic-bezier(.16,1,.3,1) forwards}
  .pp.in .cuerpo{animation:wipeIn .8s .25s cubic-bezier(.16,1,.3,1) both}
  .pp.in .cuerpo::after{animation:brillo 1.4s 1.1s ease forwards}
  .pp.in .txt{animation:txtIn .7s cubic-bezier(.16,1,.3,1) forwards}
  .pp.in .k{animation-delay:.55s}.pp.in .t{animation-delay:.68s}.pp.in .s{animation-delay:.8s}
  /* Salida */
  .pp.out{visibility:visible}
  .pp.out .txt{opacity:1;transform:none;animation:txtOut .35s cubic-bezier(.7,0,.84,0) forwards}
  .pp.out .cuerpo{animation:wipeOut .6s .2s cubic-bezier(.7,0,.84,0) forwards}
  .pp.out .cuadro{transform:none;animation:cuadroOut .5s .55s cubic-bezier(.7,0,.84,0) forwards}
  .pp.out .franja{transform:scaleX(1);animation:franjaOut .6s .5s cubic-bezier(.7,0,.84,0) forwards}

  @keyframes franjaIn{to{transform:scaleX(1)}}
  @keyframes franjaOut{to{transform:scaleX(0)}}
  @keyframes cuadroIn{to{transform:none}}
  @keyframes cuadroOut{to{transform:translateX(-110%)}}
  @keyframes wipeIn{from{clip-path:polygon(40px 0,40px 0,0 50%,40px 100%,40px 100%,0 50%)}to{clip-path:polygon(40px 0,100% 0,100% 100%,40px 100%,0 50%,0 50%)}}
  @keyframes wipeOut{from{clip-path:polygon(40px 0,100% 0,100% 100%,40px 100%,0 50%,0 50%)}to{clip-path:polygon(40px 0,40px 0,0 50%,40px 100%,40px 100%,0 50%)}}
  @keyframes txtIn{to{opacity:1;transform:none}}
  @keyframes txtOut{to{opacity:0;transform:translateY(-20px)}}
  @keyframes brillo{to{transform:translateX(120%)}}
</style>
</head>
<body class="transparente">
  <div class="pp" id="pp">
    <div class="franja"></div>
    <div class="fila">
      <div class="cuadro"></div>
      <div class="cuerpo">
        <div class="k txt" id="k"></div>
        <div class="t txt" id="t"></div>
        <div class="s txt" id="s"></div>
      </div>
    </div>
  </div>
<script src="datos.js"></script>
<script src="comun.js"></script>
<script>
const {P,$,esc,expositor,vivo,escuchaPrevia,colores} = UT;
const pp = $("#pp");
const previa = P.get("previa") === "1";
const abajo = Number(P.get("b") || 25);
pp.style.top = (1080 - abajo - 165) + "px";

const cfg = () => Object.assign({auto:true, cadaMin:5, durSeg:20}, UT.D.ponencia || {});
let visible = false, tHide = null, tNext = null;
let ultimoCmd = (UT.D.ponenciaCmd || {}).t || 0;

function contenido(){
  colores();
  const D = UT.D, e = Object.assign({}, expositor(P.get("id")) || {});
  // Texto directo desde la URL de la fuente en OBS (tiene prioridad sobre datos.js)
  ["nombre","tema","cargo"].forEach(k => { if(P.get(k) !== null) e[k] = P.get(k); });
  $("#k").textContent = P.get("k") || D.bannerKicker || "PONENCIA PRESENTADA POR";
  $("#t").textContent = e.nombre || "Nombre del expositor";
  $("#s").innerHTML = (e.tema ? `<b>${esc(e.tema)}</b>` : "") + (e.cargo ? (e.tema ? " · " : "") + esc(e.cargo) : "");
}
function mostrar(){ contenido(); pp.classList.remove("out"); void pp.offsetWidth; pp.classList.add("in"); visible = true; }
function ocultar(){ if(!visible) return; pp.classList.remove("in"); void pp.offsetWidth; pp.classList.add("out"); visible = false; }

// Muestra la tarjeta y programa la salida y la próxima aparición
function ciclo(){
  clearTimeout(tHide); clearTimeout(tNext);
  mostrar();
  const c = cfg();
  if(c.auto){
    if(c.durSeg > 0) tHide = setTimeout(ocultar, c.durSeg * 1000);
    if(c.cadaMin > 0) tNext = setTimeout(ciclo, c.cadaMin * 60000);
  }
}

// Órdenes instantáneas desde el Deck
UT.alEvento(d => {
  if(d.accion === "mostrar") ciclo();
  else if(d.accion === "ocultar"){ clearTimeout(tHide); ocultar(); }
  else if(d.accion === "alternar"){ if(visible){ clearTimeout(tHide); ocultar(); } else ciclo(); }
  else if(d.accion === "actual" && visible) contenido();
});

if(previa){
  contenido(); mostrar();
  escuchaPrevia(()=>{ contenido(); });
} else {
  setTimeout(ciclo, 1200);
  let cfgAntes = JSON.stringify(cfg());
  vivo(()=>{
    if(visible) contenido();
    const cmd = UT.D.ponenciaCmd || {};
    if(cmd.t && cmd.t !== ultimoCmd){
      ultimoCmd = cmd.t;
      if(cmd.accion === "ocultar"){ clearTimeout(tHide); ocultar(); }
      else ciclo();
      cfgAntes = JSON.stringify(cfg());
      return;
    }
    const cfgAhora = JSON.stringify(cfg());
    if(cfgAhora !== cfgAntes){           // cambió el intervalo o la duración: reprograma
      cfgAntes = cfgAhora; clearTimeout(tNext);
      const c = cfg(); if(c.auto && c.cadaMin > 0) tNext = setTimeout(ciclo, c.cadaMin * 60000);
      if(!c.auto && !visible) ciclo();
    }
  }, 1500);
}
// Vista en navegador: clic para alternar
document.addEventListener("click", ()=> visible ? ocultar() : mostrar());
</script>
</body>
</html>
